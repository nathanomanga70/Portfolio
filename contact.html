<main>
  <section class="section-dark">
    <div class="inner">
      <p class="eyebrow">Contact</p>
      <h1>Get in touch</h1>
      <p class="contact-line">Phone: <a href="tel:+254114832592">+254 114832592</a> &nbsp;·&nbsp; Email: <a href="mailto:nathanomanga70@gmail.com">nathanomanga70@gmail.com</a> &nbsp;·&nbsp; Location: Nairobi, Kenya</p>
    </div>
  </section>
  <section class="section-light">
    <div class="inner">
      <form id="contact-form" action="https://formspree.io/f/xbgrpjjk" method="POST" novalidate>
        <div class="form-group">
          <label for="name">Name</label>
          <input type="text" id="name" name="name" autocomplete="name" required aria-describedby="name-error">
          <span class="field-error" id="name-error" aria-live="polite"></span>
        </div>
        <div class="form-group">
          <label for="email">Email</label>
          <input type="email" id="email" name="email" autocomplete="email" required aria-describedby="email-error">
          <span class="field-error" id="email-error" aria-live="polite"></span>
        </div>
        <div class="form-group">
          <label for="message">Message</label>
          <textarea id="message" name="message" rows="5" maxlength="1000" required aria-describedby="message-error char-count"></textarea>
          <span class="char-count" id="char-count">0 / 1000</span>
          <span class="field-error" id="message-error" aria-live="polite"></span>
        </div>
        <div class="hp-field" aria-hidden="true">
          <label for="gotcha">Leave this field empty</label>
          <input type="text" id="gotcha" name="_gotcha" tabindex="-1" autocomplete="off">
        </div>
        <button type="submit">Send Message</button>
        <p id="form-status" role="status" aria-live="polite"></p>
      </form>
    </div>
  </section>
</main>
