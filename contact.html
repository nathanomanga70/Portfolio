<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Contact — Nathan Omanga Ndjekondo</title>
<link rel="stylesheet" href="style.css">
</head>
<body>

<nav>
  <div class="container">
    <a href="index.html" class="logo">[&#9992;&#65039; FD]</a>
    <div class="nav-links">
      <a href="index.html">Home</a>
      <a href="about.html">About</a>
      <a href="portfolio.html">Portfolio</a>
      <a href="skills.html">Skills</a>
      <a href="contact.html">Contact</a>
    </div>
  </div>
</nav>

<main>
  <div class="container">
    <div class="eyebrow">Contact</div>
    <h1>Contact Nathan</h1>
    <p>Nairobi, Kenya &middot; nathanomanga70@gmail.com &middot; +254 114832592</p>
    <p><a href="https://linkedin.com/in/nathan-omanga">linkedin.com/in/nathan-omanga</a></p>

    <hr class="rule">

    <form id="contact-form" action="https://formspree.io/f/xbgrpjjk" method="POST">
      <div class="form-group">
        <label for="name">Name</label>
        <input type="text" id="name" name="name" required>
      </div>
      <div class="form-group">
        <label for="email">Email</label>
        <input type="email" id="email" name="email" required>
      </div>
      <div class="form-group">
        <label for="message">Message</label>
        <textarea id="message" name="message" rows="5" required></textarea>
      </div>
      <button type="submit">Send Message</button>
      <p id="form-status"></p>
    </form>
  </div>
</main>

<footer>
  <div class="container">
    &copy; 2026 Nathan Omanga Ndjekondo
  </div>
</footer>

<script>
const form = document.getElementById('contact-form');
const status = document.getElementById('form-status');

form.addEventListener('submit', async (e) => {
  e.preventDefault();
  const data = new FormData(form);
  try {
    const response = await fetch(form.action, {
      method: 'POST',
      body: data,
      headers: { 'Accept': 'application/json' }
    });
    if (response.ok) {
      status.textContent = "Message sent — thank you, I'll get back to you soon.";
      form.reset();
    } else {
      status.textContent = "Something went wrong. Please try again or email me directly.";
    }
  } catch (error) {
    status.textContent = "Something went wrong. Please try again or email me directly.";
  }
});
</script>

</body>
</html>
